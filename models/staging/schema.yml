version: 2

models:
  - name: stg_philosophy
    description: "Staging model for philosophy dataset. Cleans and enriches raw data."
    columns:
      - name: author
        description: "Name of the philosopher."
        tests:
          - not_null
      - name: title
        description: "Title of the work."
        tests:
          - not_null
      - name: school_of_thought
        description: "Philosophical school the author belongs to."
      - name: school_id
        description: "Surrogate key for the school of thought."
        tests:
          - not_null
      - name: publication_year
        description: "Year of original publication (approximate)."
      - name: sentence_text
        description: "The actual text of the sentence."
      - name: sentiment_score
        description: "Polarity score calculated via TextBlob (-1 to 1)."
      - name: sentence_word_count
        description: "Number of words in the sentence."
